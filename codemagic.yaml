# nxnative en Codemagic: descarga tus NSP de Google Drive, genera el IPA y lo sube a Drive.
# Va en la raíz de TU fork de https://github.com/seedds/nxnative
#
# Secretos (Codemagic → tu app → Environment variables, grupo "nxnative_secrets", marcados como Secret):
#   RCLONE_CONF_B64  = tu rclone.conf en base64 (acceso a tu Google Drive)
#   PROD_KEYS_B64    = tu prod.keys en base64
#
# En Google Drive: crea la carpeta  nxnative/juego  y pon ahí los NSP (juego base + actualización).
# El IPA aparecerá en  nxnative/ipa

workflows:
  nxnative-ipa:
    name: nxnative IPA
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      groups:
        - nxnative_secrets
      vars:
        DRIVE_GAME: "gdrive:nxnative/juego"
        DRIVE_OUT: "gdrive:nxnative/ipa"
      xcode: latest
    scripts:
      - name: Instalar herramientas
        script: |
          set -e
          brew install xcodegen zstd spirv-cross rclone
          brew install --cask dotnet-sdk
          python3 -m pip install lz4 capstone fonttools backports.zstd \
            || python3 -m pip install --break-system-packages lz4 capstone fonttools backports.zstd
          xcodebuild -downloadComponent MetalToolchain
          echo "PATH=$PATH:/usr/local/share/dotnet" >> $CM_ENV

      - name: Preparar secretos
        script: |
          set -e
          mkdir -p ~/.config/rclone ~/keys
          echo "$RCLONE_CONF_B64" | base64 --decode > ~/.config/rclone/rclone.conf
          echo "$PROD_KEYS_B64"   | base64 --decode > ~/keys/prod.keys

      - name: Descargar NSP de Google Drive
        script: |
          set -e
          mkdir -p ~/Games/juego
          rclone copy "$DRIVE_GAME" ~/Games/juego --include "*.nsp" --transfers 4 --stats 30s --stats-one-line
          ls -lh ~/Games/juego

      - name: Generar IPA
        script: |
          set -e
          mkdir -p ~/out
          python3 scripts/build_ipa_from_nsp.py ~/Games/juego -k ~/keys/prod.keys \
            -o ~/out/nxnative.ipa --no-keep-extracted --progress lines
          ls -lh ~/out

      - name: Subir IPA a Google Drive
        script: |
          set -e
          rclone copy ~/out "$DRIVE_OUT" --include "*.ipa" --stats 30s --stats-one-line

      - name: Borrar claves y juegos
        script: |
          rm -rf ~/Games ~/keys ~/.config/rclone

  # Parchea el IPA que ya esta en Drive: mete el permiso Increased Memory Limit en el ejecutable
  # (firma ad-hoc con entitlements). Impactor lo lee y lo pide a Apple al firmar con tu cuenta.
  nxnative-mem-patch:
    name: nxnative parche memoria
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - nxnative_secrets
      vars:
        DRIVE_OUT: "gdrive:nxnative/ipa"
    scripts:
      - name: Preparar rclone
        script: |
          set -e
          brew install rclone
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONF_B64" | base64 --decode > ~/.config/rclone/rclone.conf
      - name: Descargar IPA
        script: |
          set -e
          mkdir -p ~/p
          rclone copyto "$DRIVE_OUT/nxnative.ipa" ~/p/nxnative.ipa --stats 30s --stats-one-line
          ls -lh ~/p
      - name: Meter el permiso de memoria
        script: |
          set -e
          cd ~/p
          unzip -q -o nxnative.ipa 'Payload/*.app/Info.plist'
          APP=$(ls -d Payload/*.app | head -1)
          EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          echo "app: $APP  ejecutable: $EXE"
          unzip -q -o nxnative.ipa "$APP/$EXE"
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' '<plist version="1.0"><dict><key>com.apple.developer.kernel.increased-memory-limit</key><true/></dict></plist>' > ent.plist
          codesign -f -s - --entitlements ent.plist "$APP/$EXE"
          echo "permisos del ejecutable:"; codesign -d --entitlements - "$APP/$EXE"
          zip -q nxnative.ipa "$APP/$EXE"
          mv nxnative.ipa nxnative-memoria.ipa
          unzip -l nxnative-memoria.ipa | tail -1
          ls -lh nxnative-memoria.ipa
      - name: Subir IPA parcheado a Drive
        script: |
          set -e
          rclone copyto ~/p/nxnative-memoria.ipa "$DRIVE_OUT/nxnative-memoria.ipa" --stats 30s --stats-one-line
      - name: Limpiar
        script: |
          rm -rf ~/p ~/.config/rclone
